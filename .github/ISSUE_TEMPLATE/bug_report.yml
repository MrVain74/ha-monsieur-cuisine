name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Danke fürs Testen! **Inoffiziell** – keine Verbindung zu Lidl,
        SilverCrest oder Tecpal. ⚠️ Bitte **keine Zugangsdaten, Tokens oder
        Geräte-IDs** in Logs/Screenshots posten.
  - type: input
    id: version
    attributes:
      label: Version der Integration
      placeholder: "z. B. v0.4.11"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Gerät
      options:
        - "MC Smart (MC3.0)"
        - "MC Compact (MC0.5)"
        - "anderes / unbekannt"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home-Assistant-Version
      placeholder: "z. B. 2025.10"
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, und was kam stattdessen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
  - type: textarea
    id: logs
    attributes:
      label: Logauszug (optional)
      description: >
        Einstellungen → System → Protokolle, nach „monsieur" filtern.
        Vorher Tokens/IDs schwärzen!
      render: text
