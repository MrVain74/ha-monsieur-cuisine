name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for testing! **Unofficial** – not affiliated with Lidl,
        SilverCrest or Tecpal. ⚠️ Please do **not** post credentials, tokens or
        device IDs in logs/screenshots.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. v0.4.12"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Device
      options:
        - "MC Smart (MC3.0)"
        - "MC Compact (MC0.5)"
        - "other / unknown"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2025.10"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: >
        Settings → System → Logs, filter for "monsieur". Redact tokens/IDs first!
      render: text
