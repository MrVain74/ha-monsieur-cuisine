name: Feature request / idea
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What is it about?
      description: Which feature or improvement would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
      description: What would it give you in everyday use?
