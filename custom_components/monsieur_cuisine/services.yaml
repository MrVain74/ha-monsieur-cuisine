send_recipe:
  fields:
    url:
      example: "https://www.chefkoch.de/rezepte/…"
      selector:
        text:
          type: url
    recipe:
      selector:
        object:
    recipe_id:
      selector:
        number:
          min: 1
          max: 999999999
          mode: box
    dry_run:
      default: false
      selector:
        boolean:
